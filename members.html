<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내전 밸런서 — 멤버 관리</title>
<style>
  :root {
    --bg: #0a101a;
    --panel: #121b29;
    --panel-2: #172233;
    --line: #263349;
    --gold: #c8aa6e;
    --gold-dim: #8a7a52;
    --text: #e9e4d9;
    --muted: #8b96a5;
    --dim: #4d5769;
    --danger: #e0635c;
    --ok: #58c98a;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: radial-gradient(1100px 500px at 50% -150px, rgba(200,170,110,0.07), transparent 70%), var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
  header.top { text-align: center; margin-bottom: 22px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.28em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .navlinks { margin-top: 10px; font-size: 12.5px; }
  .navlinks a { color: var(--gold-dim); text-decoration: none; margin: 0 8px; }
  .navlinks a:hover { color: var(--gold); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; font-weight: 700; }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 13.5px; }

  input[type="text"] {
    background: #0d1420; color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 10px; font-size: 13px; font-family: inherit; width: 100%;
  }
  input[type="text"]:focus { outline: none; border-color: var(--gold-dim); }
  input.bad { border-color: var(--danger) !important; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  button:hover { border-color: var(--gold-dim); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { background: #2a2417; color: var(--gold); border-color: var(--gold-dim); font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .countline { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  /* 행을 팀 배치 카드(2팀, 왼쪽 정렬)와 같은 양식으로: [티어][이름][포지션] */
  .row {
    display: flex; gap: 8px; align-items: center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 10px; margin-bottom: 8px; font-size: 13px;
  }
  .row input.tier {
    flex: 0 0 84px; text-align: center; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .row .name { flex: 0 0 120px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input.name-in { flex: 0 0 120px; font-weight: 700; }
  .row input.pos { flex: 1; color: var(--muted); }
  .row.changed { border-color: var(--gold-dim); }
  .addrow-title { color: var(--gold-dim); font-size: 12px; margin: 14px 0 6px; font-weight: 700; }
  @media (max-width: 560px) {
    .row { flex-wrap: wrap; }
    .row .name, .row input.name-in { flex: 1 1 100%; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #1d2333; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 18px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Custom Match Balancer</div>
    <h1>멤버 관리</h1>
    <div class="sub">자동완성에 쓰이는 선수 정보(티어·포지션)를 수정·삭제합니다</div>
    <div class="navlinks">
      <a href="index.html">← 밸런서</a> · <a href="stats.html">📊 대전 기록·랭킹</a>
    </div>
  </header>

  <div class="panel">
    <h2>저장된 멤버</h2>
    <div class="hint">
      티어는 밸런서와 같은 줄임말(<b>아·브·실·골·플·에·다·마·그마·챌</b>)+숫자,
      포지션은 공백으로 구분해 <b>앞이 주 포지션</b> (예: <b>미드 서폿</b> · 불가는 <b>!서폿</b> · 비우면 올라운더).
      고치면 <b>저장</b>이 켜지고, 저장하면 모든 접속자에게 반영됩니다. 이름 변경은 삭제 후 아래에서 새로 추가하세요.
    </div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="이름 검색…">
      <button id="btn-refresh">새로고침</button>
    </div>
    <div class="countline" id="countline"></div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
    <div class="addrow-title">＋ 새 멤버 추가</div>
    <div class="row" id="addrow">
      <input type="text" class="tier" id="add-tier" placeholder="티어" maxlength="10">
      <input type="text" class="name-in" id="add-name" placeholder="이름" maxlength="40">
      <input type="text" class="pos" id="add-pos" placeholder="포지션 (예: 미드 서폿 !탑)" maxlength="120">
      <button class="primary" id="btn-add">추가</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

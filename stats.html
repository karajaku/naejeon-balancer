<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내전 밸런서 — 대전 기록·랭킹</title>
<style>
  :root {
    --bg: #0a101a;
    --panel: #121b29;
    --panel-2: #172233;
    --line: #263349;
    --gold: #c8aa6e;
    --gold-dim: #8a7a52;
    --text: #e9e4d9;
    --muted: #8b96a5;
    --dim: #4d5769;
    --blue: #4c9be0;
    --red: #e0635c;
    --danger: #e0635c;
    --ok: #58c98a;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: radial-gradient(1100px 500px at 50% -150px, rgba(200,170,110,0.07), transparent 70%), var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 64px; }
  header.top { text-align: center; margin-bottom: 22px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.28em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .backlink { display: inline-block; margin-top: 10px; color: var(--gold-dim); font-size: 12.5px; text-decoration: none; }
  .backlink:hover { color: var(--gold); }

  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .tabs button {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .tabs button.cur { background: #2a2417; color: var(--gold); border-color: var(--gold-dim); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 13.5px; }

  /* 요약 카드 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: center; }
  .stat-card .v { font-size: 22px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat-card .k { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* 랭킹 표 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid rgba(38,51,73,0.5); font-variant-numeric: tabular-nums; }
  td.name { font-weight: 700; }
  td.num, th.num { text-align: right; }
  .ratebar { display: inline-block; vertical-align: middle; width: 74px; height: 6px; background: var(--panel-2); border-radius: 3px; margin-right: 8px; overflow: hidden; }
  .ratebar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
  tr.low td { color: var(--dim); }
  tr.low td.name { color: var(--muted); font-weight: 400; }
  .offrec { color: var(--muted); font-size: 12px; }
  .medal { margin-right: 4px; }

  /* 경기 기록 */
  .match { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; margin-bottom: 10px; }
  .match-head { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .match-head .when { font-variant-numeric: tabular-nums; }
  .winbadge { font-weight: 800; }
  .winbadge.b { color: var(--blue); }
  .winbadge.r { color: var(--red); }
  .pred { margin-left: auto; }
  .pred .hit { color: var(--ok); }
  .pred .miss { color: var(--danger); }
  .match-head button.del {
    background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    font-size: 11px; padding: 2px 8px; cursor: pointer; font-family: inherit;
  }
  .match-head button.del:hover { border-color: var(--danger); color: var(--danger); }
  .lanes { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 2px 8px; font-size: 12.5px; }
  .lanes .b { text-align: right; }
  .lanes .lane { text-align: center; color: var(--dim); font-size: 11.5px; align-self: center; }
  .lanes .won { font-weight: 700; }
  .lanes .b.won { color: var(--blue); }
  .lanes .r.won { color: var(--red); }
  .offmark { color: var(--danger); font-size: 11px; font-weight: 700; }
  .mtier { font-weight: 700; font-size: 11.5px; }
  .mpos { color: var(--dim); font-size: 11px; }
  .rk-tier { font-weight: 700; font-size: 12px; white-space: nowrap; }
  .rk-pos { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .foot { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 18px; }
  @media (max-width: 560px) { .lanes { font-size: 11.5px; } }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #1d2333; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 18px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
